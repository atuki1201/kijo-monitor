<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5f4a"><link rel="manifest" href="manifest.json"><title>施設監視</title>
<style>
:root{--g:#1f5f4a;--bg:#f4f7f5;--b:#d7e1db;--mut:#687770;--red:#b63232}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1d2722;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{background:var(--g);color:#fff;padding:14px 16px calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:10}h1{font-size:18px;margin:0 0 5px}.sub{font-size:12px;opacity:.9}
main{max-width:780px;margin:auto;padding:12px 12px 92px}.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:14px;margin:10px 0}.hidden{display:none!important}
h2{font-size:16px;margin:0 0 10px}.hint,.small{font-size:12px;color:var(--mut)}label{display:block;font-size:12px;font-weight:800;color:#52615b;margin:9px 0 5px}
input,select,textarea{width:100%;font-size:16px;border:1px solid #cbd6d0;border-radius:10px;padding:11px;background:#fff}textarea{min-height:80px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit}.btn{border:1px solid #cbd6d0;background:#fff;border-radius:10px;padding:11px 8px;font-weight:800;font-size:13px}.primary{background:var(--g);color:#fff;border:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}.tab{border:0;background:#fff;border:1px solid var(--b);border-radius:10px;padding:11px 3px;font-size:12px;font-weight:800}.tab.active{background:var(--g);color:#fff}
.section{font-size:13px;color:var(--g);font-weight:900;margin:15px 0 7px}.item{border:1px solid var(--b);border-radius:12px;padding:11px;margin:8px 0}.item-title{font-size:13px;font-weight:800;line-height:1.45}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.choice .active.ok{background:#eaf7ef;border-color:#77bb92;color:#19673d}.choice .active.ng{background:#fff0f0;border-color:#e28c8c;color:#9f2929}.choice .active.na{background:#f0f3f2;color:#52615d}.extra{display:none}.item.ng .extra{display:block}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.kpi{background:#edf6f1;border-radius:10px;padding:8px;text-align:center}.kpi b{display:block;color:var(--g);font-size:19px}.kpi span{font-size:10px;color:var(--mut)}
.record{padding:12px;border:1px solid var(--b);border-radius:12px;margin:8px 0}.record-head{display:flex;justify-content:space-between;gap:8px}.badge{padding:3px 7px;border-radius:99px;background:#eaf1ee;color:var(--g);font-size:10px;font-weight:900}.ng{color:var(--red)}
footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--b);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:7px;z-index:20}footer .btn{flex:1}
@media(max-width:460px){.row2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header><h1>施設監視</h1><div class="sub"><span id="headFacility">施設未選択</span> ｜ <span id="headUser">使用者未登録</span></div></header>
<main>
<section id="setup">
<div class="card" id="userCard"><h2>このスマホの使用者</h2><div class="hint">最初だけ登録します。</div><label>名前</label><input id="userName" placeholder="例：田村"><label>役割（任意）</label><input id="userRole" placeholder="例：水管理担当"><button class="btn primary" id="saveUser" style="width:100%;margin-top:12px">使用者を登録</button></div>
<div class="card hidden" id="facCard"><h2>施設登録</h2><label>施設名</label><input id="facName" placeholder="例：ジンノウチ機場"><label>施設番号（任意）</label><input id="facNo" placeholder="例：M-001"><button class="btn primary" id="addFac" style="width:100%;margin-top:12px">施設を登録</button></div>
<div class="card hidden" id="facListCard"><h2>登録済み施設</h2><div id="facList"></div></div>
</section>
<section id="app" class="hidden">
<div class="tabs"><button class="tab active" data-v="entry">点検入力</button><button class="tab" data-v="history">記録一覧</button><button class="tab" data-v="backup">出力・取込</button><button class="tab" data-v="settings">設定</button></div>
<div id="entry" class="view">
<div class="card"><h2>点検記録</h2><div class="row2"><div><label>点検日時</label><input id="inspectAt" type="datetime-local"></div><div><label>前回点検日</label><input id="prevAt" type="date"></div></div><label>重要度</label><select id="importance"><option>S-5</option><option>S-4</option><option>S-3</option><option>S-2</option><option>S-1</option></select><div class="kpis" style="margin-top:12px"><div class="kpi"><b id="done">0</b><span>点検済み</span></div><div class="kpi"><b id="ngCount">0</b><span>異常あり</span></div><div class="kpi"><b id="left">37</b><span>未入力</span></div><div class="kpi"><b id="pdone">0</b><span>定点</span></div></div></div>
<div class="card"><h2>日常点検</h2><div class="hint">各項目をタップ。「異常あり」のときだけ詳細を入力します。</div><div id="checks"></div></div>
<div class="card"><h2>施設監視（定点）</h2><div id="points"></div></div>
<div class="card"><h2>全体記録</h2><label>施設情報</label><input id="facilityInfo"><label>住所</label><input id="address"><label>所見</label><textarea id="finding"></textarea><label>特記事項</label><textarea id="special"></textarea><button class="btn primary" id="saveRecord" style="width:100%;margin-top:12px">この記録を保存</button></div>
</div>
<div id="history" class="view hidden"><div class="card"><h2>記録一覧</h2><div class="row2"><div><label>施設</label><select id="filterFac"><option value="">すべて</option></select></div><div><label>年</label><select id="filterYear"><option value="">すべて</option></select></div></div><label>表示</label><select id="filterStatus"><option value="">すべて</option><option value="ng">異常ありのみ</option><option value="ok">異常なしのみ</option></select></div><div id="records"></div></div>
<div id="backup" class="view hidden"><div class="card"><h2>PCへ取り込む</h2><div class="hint">CSVはExcelで開けます。JSONはバックアップ用です。</div><div class="row2" style="margin-top:10px"><button class="btn primary" id="csvBtn">PC取込用CSV</button><button class="btn primary" id="jsonBtn">バックアップ</button></div></div><div class="card"><h2>PCから取り込む</h2><input id="jsonIn" type="file" accept=".json,application/json"></div></div>
<div id="settings" class="view hidden"><div class="card"><h2>設定</h2><label>使用者</label><input id="setUser" readonly><label>施設</label><select id="setFac"></select><button class="btn primary" id="changeFac" style="width:100%;margin-top:12px">この施設に切り替える</button><button class="btn" id="changeUser" style="width:100%;margin-top:8px">使用者名を変更</button></div></div>
</section></main>
<footer id="footer" class="hidden"><button class="btn" id="switch">施設切替</button><button class="btn primary" id="saveBottom">保存</button></footer>
<script src="checks.js?v=7"></script><script src="app.js?v=7"></script></body></html>
