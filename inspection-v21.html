<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5f4a">
<title>施設監視 v18 テスト</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#1d2722;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{background:#1f5f4a;color:white;padding:18px 16px}h1{font-size:20px;margin:0 0 5px}.sub{font-size:13px}
main{max-width:760px;margin:auto;padding:14px 12px 100px}.card{background:white;border:1px solid #d7e1db;border-radius:14px;padding:16px;margin-bottom:12px}h2{font-size:17px;margin:0 0 12px}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}input,select,textarea{width:100%;padding:13px;border:1px solid #cbd6d0;border-radius:10px;font-size:16px;background:white}textarea{min-height:80px}
button{font:inherit;cursor:pointer}.primary{width:100%;margin-top:14px;padding:14px;border:0;border-radius:11px;background:#1f5f4a;color:white;font-weight:bold;font-size:16px}.secondary{padding:11px;border:1px solid #ccd6d1;background:white;border-radius:10px;font-weight:bold}
.hidden{display:none!important}.facility{display:flex;justify-content:space-between;align-items:center;border:1px solid #d7e1db;border-radius:11px;padding:12px;margin:8px 0}.facility button{margin-left:8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}.tab{padding:11px 4px;border:1px solid #d7e1db;border-radius:10px;background:white;font-weight:bold;font-size:12px}.tab.active{background:#1f5f4a;color:white}
.checkSection{border:1px solid #cfdcd5;border-radius:13px;margin:10px 0;overflow:hidden;background:#fff}.subSection{margin:7px 2px;border:1px solid #d8e1dc;border-radius:11px;overflow:hidden;background:#fff}.subHead{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 12px;border:0;background:#f7faf8;color:#40564b;font-weight:800;text-align:left;font-size:13px}.subHead .subCount{font-size:11px;font-weight:700;white-space:nowrap}.subHead .subChev{font-size:12px}.subBody{padding:2px 6px 6px}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 14px;border:0;background:#eef5f1;color:#1f5f4a;font-weight:800;text-align:left}.sectionHead .chev{font-size:15px}.sectionHead .sectionCount{font-size:11px;font-weight:700;white-space:nowrap}.sectionBody{padding:4px 9px 10px}.item{border:2px solid #d7e1db;border-radius:11px;padding:12px;margin:8px 0;background:#fff;transition:.15s}.item.state-ok{border-color:#1f9d55;background:#f3fbf6;box-shadow:inset 0 0 0 2px rgba(31,157,85,.10)}.item.state-ng{border-color:#d62828;background:#fff5f5;box-shadow:inset 0 0 0 2px rgba(214,40,40,.10)}.item.state-na{border-color:#5c6770;background:#f3f5f4;box-shadow:inset 0 0 0 2px rgba(92,103,112,.10)}.item b{font-size:13px;line-height:1.5}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.choices button{padding:12px 3px;min-height:44px;border:2px solid #c7d2cc!important;background:#fff!important;color:#1d2722!important;border-radius:9px;font-weight:800;font-size:12px;transition:.12s;position:relative}.choices button.selected{font-weight:900!important;transform:scale(1.02)}.choices button.selected::before{content:"✓";display:inline-block;margin-right:4px;font-size:14px}.detail{display:none}.item.is-ng .detail{display:block}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.kpi{background:#edf6f1;border-radius:10px;padding:9px;text-align:center}.kpi strong{display:block;font-size:20px;color:#1f5f4a}.kpi span{font-size:11px}.historyRow{border:1px solid #d7e1db;border-radius:12px;padding:13px;margin:8px 0;background:#fff}.historyRow button{width:100%;margin-top:10px}.statusPill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.statusPill.ok{background:#eaf7ef;color:#277a48}.statusPill.ng{background:#fff0f0;color:#b12626}.historyDetail .detailHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.historyDetail .backBtn{padding:9px 11px;border:1px solid #ccd6d1;background:#fff;border-radius:9px;font-weight:800}.detailSection{border:1px solid #d7e1db;border-radius:12px;margin:9px 0;overflow:hidden;background:#fff}.detailSection h3{margin:0;padding:11px 13px;background:#eef5f1;color:#1f5f4a;font-size:14px}.detailItem{padding:10px 13px;border-top:1px solid #edf0ee}.detailItem:first-child{border-top:0}.detailItem .name{font-size:12px;font-weight:700}.detailItem .result{margin-top:5px;font-size:12px}.detailItem .comment{margin-top:6px;color:#58635e;font-size:12px}
#appFooter{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid #d7e1db;padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:7px}#appFooter button{flex:1}
.notice{background:#fff7df;border:1px solid #ead28b;padding:11px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<header><h1>施設監視 <span style="font-size:11px">v18 TEST</span></h1><div class="sub"><span id="headerFacility">施設未選択</span> ｜ <span id="headerUser">使用者未登録</span></div></header>
<main>
<section id="setup">
<div class="card" id="userCard">
<h2>このスマホの使用者</h2><div class="notice">最初に名前を登録してください。</div>
<label for="userName">名前</label><input id="userName" type="text" autocomplete="name" placeholder="例：田村">
<label for="userRole">役割（任意）</label><input id="userRole" type="text" placeholder="例：水管理担当">
<button type="button" class="primary" id="registerUserButton">使用者を登録</button>
</div>
<div class="card hidden" id="facilityCard">
<h2>施設登録</h2>
<label for="facilityName">施設名</label><input id="facilityName" type="text" placeholder="例：ジンノウチ機場">
<label for="facilityNo">施設番号（任意）</label><input id="facilityNo" type="text" placeholder="例：M-001">
<button type="button" class="primary" id="registerFacilityButton">施設を登録</button>
</div>
<div class="card hidden" id="facilityListCard"><h2>登録済み施設</h2><div id="facilityList"></div></div>
</section>

<section id="app" class="hidden">
<div class="tabs">
<button class="tab active" data-page="entry">点検入力</button>
<button class="tab" data-page="history">記録一覧</button>
<button class="tab" data-page="settings">設定</button>
</div>
<div id="entryPage">
<div class="card"><h2>点検記録</h2><label>点検日時</label><input id="inspectDate" type="datetime-local"><div class="kpis" style="margin-top:12px"><div class="kpi"><strong id="doneCount">0</strong><span>点検済み</span></div><div class="kpi"><strong id="ngCount">0</strong><span>異常あり</span></div><div class="kpi"><strong id="leftCount">37</strong><span>未入力</span></div></div></div>
<div class="card"><h2>日常点検</h2><div id="checkList"></div></div>
<div class="card"><h2>全体記録</h2><label>所見</label><textarea id="finding"></textarea><label>特記事項</label><textarea id="special"></textarea><button type="button" class="primary" id="saveRecordButton">この記録を保存</button></div>
</div>
<div id="historyPage" class="hidden">
<div id="historyListWrap" class="card">
<h2>記録一覧</h2>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px">
<button type="button" class="secondary" id="exportCsvButton">CSV出力</button>
<button type="button" class="secondary" id="exportJsonButton">JSONバックアップ</button>
</div>
<div class="notice" style="margin-bottom:10px">CSVはExcelで開けます。JSONは記録をそのままバックアップするときに使います。</div>
<div id="historyList"></div>
</div>
<div id="historyDetail" class="hidden historyDetail">
  <div class="card">
    <div class="detailHead"><h2 style="margin:0">記録詳細</h2><button type="button" class="backBtn" id="historyBackButton" onclick="showHistory()">一覧に戻る</button></div>
    <div id="historyDetailBody" style="margin-top:12px"></div>
  </div>
</div>
</div>
<div id="settingsPage" class="hidden"><div class="card"><h2>設定</h2><label>使用者</label><input id="currentUser" readonly><label>施設</label><div id="currentFacility"></div><button type="button" class="secondary" id="switchFacilityButton" style="width:100%;margin-top:12px">施設を切り替える</button></div></div>
</section>
</main>
<div id="appFooter" class="hidden"><button type="button" class="secondary" id="footerSwitch">施設切替</button><button type="button" class="primary" id="footerSave" style="margin-top:0">保存</button></div>

<script>
(function(){
"use strict";
var CATEGORIES=[
{name:"水利用・水理",start:0,end:2},
{name:"機場本体",start:3,end:18},
{name:"ポンプ設備",start:19,end:22},
{name:"ゲート設備",start:23,end:27},
{name:"除塵設備",start:28,end:31},
{name:"電気設備",start:32,end:35},
{name:"その他",start:36,end:36}
];
var MACHINE_SUBCATEGORIES=[
{name:"建屋",start:3,end:7},
{name:"吸水槽・吐水槽",start:8,end:13},
{name:"樋門・樋管",start:14,end:16},
{name:"沈砂池・遊水池",start:17,end:18}
];
var CHECKS=[
"揚水量の異常（低下等）","吸水槽水位の異常上昇・異常低下","その他の異常",
"コンクリートの崩壊・欠損・剥落・ひび割れ","不同沈下","鉄筋露出","漏水（防水性の低下）","その他の異常",
"ゴミ等の堆積","コンクリートの崩壊・欠損・剥落・ひび割れ","不同沈下","鉄筋露出","漏水","その他の異常",
"抜け上がり・不同沈下・陥没","コンクリートの欠損・剥落・ひび割れ","その他の異常",
"周辺地盤の異常","その他の異常",
"外観の変状（錆、割れ、ボルトナットの緩み等）","異常な振動・音・過熱・異臭","油・グリースの漏れ","その他の異常",
"清掃状態の不良（ごみ、流木、土砂の堆積等）","外観の異常（塗膜損傷、劣化、発錆、損傷、変形）","異常な振動・音","漏水","その他の異常",
"清掃状態の不良（ごみ、流木、土砂の堆積等）","外観の異常（劣化・発錆・磨耗・損傷・変形等）","異常な振動・音","その他の異常",
"外観の異常（盤面及び盤内機器変色等）","計器類が正常に作動しない","異常な音・過熱・異臭","その他の異常",
"周辺住民からの苦情"
];
var USER_KEY="facility_user_v1",FAC_KEY="facility_list_v1",CURRENT_KEY="facility_current_v1",REC_KEY="facility_records_v1";
var user=null,facilities=[],current=null;
function $(id){return document.getElementById(id);}
function read(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function write(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){alert("端末への保存が許可されていません。Safariの設定を確認してください。");return false}}
function setDate(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$("inspectDate").value=d.toISOString().slice(0,16)}
function renderFacilities(){var box=$("facilityList");box.innerHTML="";if(!facilities.length){box.textContent="まだ施設がありません。";return}facilities.forEach(function(f){var row=document.createElement("div");row.className="facility";var span=document.createElement("span");span.textContent=f.name+(f.no?"（"+f.no+"）":"");var b=document.createElement("button");b.type="button";b.className="secondary";b.textContent="開始";b.addEventListener("click",function(){startFacility(f)});row.appendChild(span);row.appendChild(b);box.appendChild(row)})}
function showUser(){if(!user)return;$("userCard").classList.add("hidden");$("facilityCard").classList.remove("hidden");$("facilityListCard").classList.remove("hidden");$("headerUser").textContent=user.role?user.name+"（"+user.role+"）":user.name;$("currentUser").value=user.name;renderFacilities()}
function registerUser(){var name=$("userName").value.trim();if(name===""){window.alert("名前を入力してください。");return}user={name:name,role:$("userRole").value.trim()};if(!write(USER_KEY,user))return;showUser()}
function registerFacility(){var name=$("facilityName").value.trim();if(name===""){window.alert("施設名を入力してください。");return}var f={id:String(Date.now()),name:name,no:$("facilityNo").value.trim()};facilities.push(f);write(FAC_KEY,facilities);startFacility(f)}
function startFacility(f){current=f;write(CURRENT_KEY,f);$("headerFacility").textContent=f.name;$("setup").classList.add("hidden");$("app").classList.remove("hidden");$("appFooter").classList.remove("hidden");renderCurrentFacility();newRecord()}
function renderCurrentFacility(){$("currentFacility").textContent=current?current.name:"施設未選択"}
function paintButton(btn,value){
  btn.classList.remove("selected","ok","ng","na");
  btn.style.setProperty("background-color","#fff","important");
  btn.style.setProperty("color","#1d2722","important");
  btn.style.setProperty("border-color","#c7d2cc","important");
  btn.style.setProperty("box-shadow","none","important");
  if(value){
    btn.classList.add("selected",value);
    var bg=value==="ok"?"#2e9f5b":value==="ng"?"#d83a3a":"#68756f";
    btn.style.setProperty("background-color",bg,"important");
    btn.style.setProperty("color","#fff","important");
    btn.style.setProperty("border-color",bg,"important");
    btn.style.setProperty("box-shadow","0 0 0 2px rgba(31,95,74,.18)","important");
  }
}
function applyItemState(item,value){
  item.classList.remove("state-ok","state-ng","state-na","is-ng");
  if(value==="ok") item.classList.add("state-ok");
  if(value==="ng") item.classList.add("state-ng","is-ng");
  if(value==="na") item.classList.add("state-na");
}
function paintButton(btn,value){
  btn.classList.remove("selected","ok","ng","na");
  btn.style.backgroundColor="#fff";
  btn.style.color="#1d2722";
  btn.style.borderColor="#aebbb4";
  btn.style.boxShadow="none";
  if(value){
    btn.classList.add("selected",value);
    var bg=value==="ok"?"#1f9d55":value==="ng"?"#d62828":"#5c6770";
    btn.style.backgroundColor=bg;
    btn.style.color="#fff";
    btn.style.borderColor=bg;
    btn.style.boxShadow="0 0 0 3px rgba(0,0,0,.10)";
  }
}
function applyItemState(item,value){
  item.classList.remove("state-ok","state-ng","state-na","is-ng");
  if(value==="ok") item.classList.add("state-ok");
  if(value==="ng") item.classList.add("state-ng","is-ng");
  if(value==="na") item.classList.add("state-na");
}
function renderItems(container,start,end){
  for(var i=start;i<=end;i++){
    var item=document.createElement("div");
    item.className="item";
    item.dataset.index=i;

    var title=document.createElement("b");
    title.textContent=CHECKS[i];
    item.appendChild(title);

    var choices=document.createElement("div");
    choices.className="choices";
    [["ok","異常なし"],["ng","異常あり"],["na","対象外"]].forEach(function(pair){
      var btn=document.createElement("button");
      btn.type="button";
      btn.className="checkChoice";
      btn.dataset.value=pair[0];
      btn.textContent=pair[1];
      paintButton(btn,"");
      choices.appendChild(btn);
    });
    item.appendChild(choices);

    var detail=document.createElement("div");
    detail.className="detail";
    detail.innerHTML="<label>位置・状況</label><input class='location'><label>コメント</label><textarea class='comment'></textarea>";
    item.appendChild(detail);
    container.appendChild(item);
  }
}
function buildChecks(){
var box=$("checkList");
box.innerHTML="";

CATEGORIES.forEach(function(cat,ci){
  var sec=document.createElement("div");
  sec.className="checkSection";

  var head=document.createElement("button");
  head.type="button";
  head.className="sectionHead";

  var left=document.createElement("span");
  left.textContent=(ci+1)+"．"+cat.name;

  var count=document.createElement("span");
  count.className="sectionCount";
  count.id="sectionCount"+ci;
  count.textContent=(cat.end-cat.start+1)+"項目";

  var chev=document.createElement("span");
  chev.className="chev";
  chev.textContent="▲";

  head.appendChild(left);
  head.appendChild(count);
  head.appendChild(chev);

  var body=document.createElement("div");
  body.className="sectionBody";

  if(cat.name==="機場本体"){
    MACHINE_SUBCATEGORIES.forEach(function(sub){
      var subSec=document.createElement("div");
      subSec.className="subSection";

      var subHead=document.createElement("button");
      subHead.type="button";
      subHead.className="subHead";

      var subTitle=document.createElement("span");
      subTitle.textContent=sub.name;

      var subCount=document.createElement("span");
      subCount.className="subCount";
      subCount.id="subCount"+sub.start;
      subCount.textContent=(sub.end-sub.start+1)+"項目";

      var subChev=document.createElement("span");
      subChev.className="subChev";
      subChev.textContent="▲";

      subHead.appendChild(subTitle);
      subHead.appendChild(subCount);
      subHead.appendChild(subChev);

      var subBody=document.createElement("div");
      subBody.className="subBody";

      renderItems(subBody,sub.start,sub.end);

      subHead.addEventListener("click",function(){
        var open=!subBody.classList.contains("hidden");
        subBody.classList.toggle("hidden");
        subChev.textContent=open?"▼":"▲";
      });

      subSec.appendChild(subHead);
      subSec.appendChild(subBody);
      body.appendChild(subSec);
    });
  }else{
    renderItems(body,cat.start,cat.end);
  }

  head.addEventListener("click",function(){
    var open=!body.classList.contains("hidden");
    body.classList.toggle("hidden");
    chev.textContent=open?"▼":"▲";
  });

  sec.appendChild(head);
  sec.appendChild(body);
  box.appendChild(sec);
});

box.addEventListener("click",function(event){
  var btn=event.target.closest(".checkChoice");
  if(!btn || !box.contains(btn)) return;

  var item=btn.closest(".item");
  if(!item) return;

  var current=item.getAttribute("data-status")||"";
  var next=(current===btn.dataset.value)?"":btn.dataset.value;

  item.querySelectorAll(".checkChoice").forEach(function(other){
    paintButton(other,(next && other===btn)?next:"");
  });

  if(next)item.setAttribute("data-status",next);
  else item.removeAttribute("data-status");

  applyItemState(item,next);
  updateStats();
});
}function updateStats(){
var items=document.querySelectorAll("#checkList .item"),done=0,ng=0;
items.forEach(function(item){
  var status=item.getAttribute("data-status")||"";
  if(status){done++;if(status==="ng")ng++}
});
$("doneCount").textContent=done;
$("ngCount").textContent=ng;
$("leftCount").textContent=CHECKS.length-done;

CATEGORIES.forEach(function(cat,ci){
  var count=0;
  document.querySelectorAll("#checkList .item").forEach(function(item){
    var idx=Number(item.dataset.index);
    if(idx>=cat.start&&idx<=cat.end&&item.getAttribute("data-status"))count++;
  });
  var el=$("sectionCount"+ci);
  if(el)el.textContent=count+"/"+(cat.end-cat.start+1)+"済";
});

MACHINE_SUBCATEGORIES.forEach(function(sub){
  var count=0;
  document.querySelectorAll("#checkList .item").forEach(function(item){
    var idx=Number(item.dataset.index);
    if(idx>=sub.start&&idx<=sub.end&&item.getAttribute("data-status"))count++;
  });
  var el=$("subCount"+sub.start);
  if(el)el.textContent=count+"/"+(sub.end-sub.start+1)+"済";
});
}
function newRecord(){
$("finding").value="";$("special").value="";
document.querySelectorAll("#checkList .item").forEach(function(item){
  item.classList.remove("state-ok","state-ng","state-na","is-ng");
  item.removeAttribute("data-status");
  item.style.borderColor="";
  item.style.backgroundColor="";
  item.querySelectorAll(".choices button").forEach(function(btn){paintButton(btn,"");});
});
document.querySelectorAll("#checkList input,#checkList textarea").forEach(function(x){x.value=""});
setDate();updateStats();
}
function collectRecord(){
var checks=[];
document.querySelectorAll("#checkList .item").forEach(function(item){
  var i=Number(item.dataset.index);
  var status=item.getAttribute("data-status")||"";
  var category=CATEGORIES.find(function(cat){return i>=cat.start&&i<=cat.end});
  checks.push({
    index:i,
    category:category?category.name:"",
    item:CHECKS[i],
    status:status,
    location:item.querySelector(".location").value,
    comment:item.querySelector(".comment").value
  });
});
return {
  id:String(Date.now())+"_"+Math.random(),
  facility:current.name,
  user:user.name,
  inspectDate:$("inspectDate").value,
  finding:$("finding").value,
  special:$("special").value,
  checks:checks,
  savedAt:new Date().toISOString()
};
}
function saveRecord(){if(!current){window.alert("先に施設を選択してください。");return}var records=read(REC_KEY,[]);records.unshift(collectRecord());if(write(REC_KEY,records)){window.alert("記録を保存しました。");newRecord();showHistory()}}
function downloadFile(filename,content,mime){
  var blob=new Blob([content],{type:mime});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1000);
}
function csvEscape(value){
  var s=String(value==null?"":value);
  return '"'+s.replace(/"/g,'""')+'"';
}
function exportCsv(){
  var records=read(REC_KEY,[]);
  if(!records.length){window.alert("保存された記録がありません。");return}
  var rows=[["記録ID","点検日時","施設","使用者","区分","点検項目","判定","位置・状況","コメント","所見","特記事項","保存日時"]];
  records.slice().reverse().forEach(function(r){
    r.checks.forEach(function(ch){
      rows.push([r.id,r.inspectDate,r.facility,r.user,ch.category||"",ch.item,ch.status==="ok"?"異常なし":ch.status==="ng"?"異常あり":ch.status==="na"?"対象外":"未入力",ch.location||"",ch.comment||"",r.finding||"",r.special||"",r.savedAt||""]);
    });
  });
  var csv="\uFEFF"+rows.map(function(row){return row.map(csvEscape).join(",")}).join("\r\n");
  var stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
  downloadFile("施設監視記録_"+stamp+".csv",csv,"text/csv;charset=utf-8");
}
function exportJson(){
  var records=read(REC_KEY,[]);
  if(!records.length){window.alert("保存された記録がありません。");return}
  var payload={exportedAt:new Date().toISOString(),user:user,facilities:facilities,records:records};
  var stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
  downloadFile("施設監視バックアップ_"+stamp+".json",JSON.stringify(payload,null,2),"application/json;charset=utf-8");
}
function showHistory(){
$("historyListWrap").classList.remove("hidden");$("historyDetail").classList.add("hidden");
var records=read(REC_KEY,[]),box=$("historyList");box.innerHTML="";
if(!records.length){box.textContent="記録がありません。";return}
records.forEach(function(r){
  var div=document.createElement("div");div.className="historyRow";
  var ng=r.checks.filter(function(c){return c.status==="ng"}).length;
  var un=r.checks.filter(function(c){return !c.status}).length;
  var statusHtml=ng?'<span class="statusPill ng">異常 '+ng+'件</span>':'<span class="statusPill ok">異常なし</span>';
  div.innerHTML="<b>"+escapeHtml(r.facility)+"</b><div class='sub' style='margin-top:4px'>"+escapeHtml(r.inspectDate)+" ｜ "+escapeHtml(r.user)+"</div><div style='margin-top:8px'>"+statusHtml+" <span style='font-size:11px;color:#6b756f;margin-left:6px'>未入力 "+un+"件</span></div>";
  var btn=document.createElement("button");btn.type="button";btn.className="secondary";btn.textContent="詳細を見る";btn.addEventListener("click",function(){showRecordDetail(r.id)});
  div.appendChild(btn);box.appendChild(div);
});
}
function showRecordDetail(id){
var records=read(REC_KEY,[]),r=records.find(function(x){return x.id===id});if(!r)return;
$("historyListWrap").classList.add("hidden");$("historyDetail").classList.remove("hidden");
var body=$("historyDetailBody");body.innerHTML="";
var meta=document.createElement("div");meta.className="notice";meta.innerHTML="<b>"+escapeHtml(r.facility)+"</b><br>"+escapeHtml(r.inspectDate)+" ｜ "+escapeHtml(r.user);
body.appendChild(meta);
CATEGORIES.forEach(function(cat){
  var sec=document.createElement("div");sec.className="detailSection";
  var h=document.createElement("h3");h.textContent=cat.name;sec.appendChild(h);
  r.checks.forEach(function(ch,pos){var idx=(ch.index!==undefined&&ch.index!==null)?Number(ch.index):pos;if(idx<cat.start||idx>cat.end)return;
    var item=document.createElement("div");item.className="detailItem";
    var status=ch.status==="ok"?"異常なし":ch.status==="ng"?"異常あり":ch.status==="na"?"対象外":"未入力";
    item.innerHTML="<div class='name'>"+escapeHtml(ch.item)+"</div><div class='result'>"+status+"</div>"+
      (ch.location?"<div class='comment'>位置・状況："+escapeHtml(ch.location)+"</div>":"")+
      (ch.comment?"<div class='comment'>コメント："+escapeHtml(ch.comment)+"</div>":"");
    sec.appendChild(item);
  });
  body.appendChild(sec);
});
var common=document.createElement("div");common.className="detailSection";
common.innerHTML="<h3>全体記録</h3><div class='detailItem'><div class='name'>所見</div><div class='comment'>"+(r.finding?escapeHtml(r.finding):"なし")+"</div></div><div class='detailItem'><div class='name'>特記事項</div><div class='comment'>"+(r.special?escapeHtml(r.special):"なし")+"</div></div>";
body.appendChild(common);
}function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function runCheckSelfTest(){
  var test=document.createElement("div");
  test.className="item";
  test.innerHTML="<div class='choices'></div>";
  var box=test.querySelector(".choices");
  var defs=[["ok","異常なし"],["ng","異常あり"],["na","対象外"]];
  defs.forEach(function(pair){
    var b=document.createElement("button");b.type="button";b.dataset.value=pair[0];b.textContent=pair[1];paintButton(b,"");
    b.addEventListener("click",function(){
      var current=test.getAttribute("data-status")||"";
      var next=current===pair[0]?"":pair[0];
      box.querySelectorAll("button").forEach(function(x){paintButton(x,next&&x===b?next:"");});
      if(next)test.setAttribute("data-status",next);else test.removeAttribute("data-status");
    });
    box.appendChild(b);
  });
  document.body.appendChild(test);
  var bs=test.querySelectorAll("button");
  bs[0].click();
  var ok1=getComputedStyle(bs[0]).backgroundColor!=="rgb(255, 255, 255)" && !test.querySelectorAll("button")[1].classList.contains("selected");
  bs[1].click();
  var ok2=getComputedStyle(bs[0]).backgroundColor==="rgb(255, 255, 255)" && getComputedStyle(bs[1]).backgroundColor!=="rgb(255, 255, 255)";
  bs[1].click();
  var ok3=getComputedStyle(bs[1]).backgroundColor==="rgb(255, 255, 255, 1)" || getComputedStyle(bs[1]).backgroundColor==="rgb(255, 255, 255)";
  test.remove();
  return !!(ok1&&ok2&&ok3);
}
function runAll37SelfTest(){
  var items=document.querySelectorAll("#checkList .item");
  if(items.length!==CHECKS.length) throw new Error("点検項目数が37ではありません: "+items.length);
  for(var i=0;i<items.length;i++){
    var item=items[i];
    var buttons=item.querySelectorAll(".checkChoice");
    if(buttons.length!==3) throw new Error("項目"+(i+1)+"の判定ボタン数が3ではありません");
    buttons[0].click();
    if(item.getAttribute("data-status")!=="ok") throw new Error("項目"+(i+1)+" 異常なしが選択できません");
    if(!buttons[0].classList.contains("selected") || buttons[1].classList.contains("selected") || buttons[2].classList.contains("selected")) throw new Error("項目"+(i+1)+" 選択状態がおかしい");
    buttons[1].click();
    if(item.getAttribute("data-status")!=="ng") throw new Error("項目"+(i+1)+" 異常ありが選択できません");
    if(buttons[0].classList.contains("selected") || !buttons[1].classList.contains("selected") || buttons[2].classList.contains("selected")) throw new Error("項目"+(i+1)+" 切替がおかしい");
    buttons[1].click();
    if(item.getAttribute("data-status")!=="") throw new Error("項目"+(i+1)+" 再タップ解除ができません");
    if(buttons[0].classList.contains("selected") || buttons[1].classList.contains("selected") || buttons[2].classList.contains("selected")) throw new Error("項目"+(i+1)+" 解除後も選択が残っています");
  }
  return "ALL 37 ITEMS OK";
}
function setupTabs(){document.querySelectorAll(".tab").forEach(function(tab){tab.addEventListener("click",function(){document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active")});tab.classList.add("active");$("entryPage").classList.add("hidden");$("historyPage").classList.add("hidden");$("settingsPage").classList.add("hidden");if(tab.dataset.page==="entry")$("entryPage").classList.remove("hidden");if(tab.dataset.page==="history"){showHistory();$("historyPage").classList.remove("hidden")}if(tab.dataset.page==="settings")$("settingsPage").classList.remove("hidden")})})}
function switchFacility(){$("setup").classList.remove("hidden");$("app").classList.add("hidden");$("appFooter").classList.add("hidden");showUser()}
if("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(reg){reg.unregister();});}).catch(function(){});
}
if("caches" in window){
  caches.keys().then(function(keys){keys.forEach(function(key){if(key.indexOf("kijo-")===0)caches.delete(key);});}).catch(function(){});
}
function boot(){user=read(USER_KEY,null);facilities=read(FAC_KEY,[]);current=read(CURRENT_KEY,null);$("registerUserButton").addEventListener("click",registerUser);$("registerFacilityButton").addEventListener("click",registerFacility);$("saveRecordButton").addEventListener("click",saveRecord);
$("exportCsvButton").addEventListener("click",exportCsv);
$("exportJsonButton").addEventListener("click",exportJson);$("footerSave").addEventListener("click",saveRecord);$("footerSwitch").addEventListener("click",switchFacility);$("switchFacilityButton").addEventListener("click",switchFacility);setupTabs();buildChecks();runAll37SelfTest();if($("historyBackButton"))$("historyBackButton").addEventListener("click",showHistory);if(user){showUser();if(current)startFacility(current)}else{$("facilityCard").classList.add("hidden");$("facilityListCard").classList.add("hidden")}setDate()}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot)}else{boot()}
})();
</script>
